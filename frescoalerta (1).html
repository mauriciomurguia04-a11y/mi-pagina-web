<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrescoAlerta · EcoMesa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF5EA;--card:#fff;--ink:#3B2438;--mut:#7a6674;--gr:#1F4D3A;--ye:#FFD65A;--or:#FFB347;--gold:#B8791B;--line:#eadfc8;--r:#D6453D;--y:#E8A81C;--g:#2E9E5B;--soft:#FFF1CF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120f;--card:#241c22;--ink:#f6ecdc;--mut:#b9a9b3;--gr:#7fd1a0;--line:#3a2e37;--soft:#3a3020;--gold:#ffc65a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120f;--card:#241c22;--ink:#f6ecdc;--mut:#b9a9b3;--gr:#7fd1a0;--line:#3a2e37;--soft:#3a3020;--gold:#ffc65a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Poppins,system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--gr);z-index:30}
.app{display:flex;min-height:100vh}
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav .brand{display:none}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px Poppins;padding:6px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav button span{font-size:20px}nav button.on{color:var(--gr);background:var(--soft)}
nav .dot{position:absolute;top:2px;right:22%;background:var(--r);color:#fff;border-radius:9px;font-size:10px;min-width:17px;padding:0 4px}
main{flex:1;width:100%;max-width:780px;margin:0 auto;padding:0 14px 96px}
header{background:var(--gr);color:#fff;margin:0 -14px 14px;padding:16px 18px;border-radius:0 0 26px 26px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:20px;line-height:1.1}header p{margin:0;font-size:12px;opacity:.85}
.logo{width:42px;height:42px;border-radius:50%;background:var(--ye);display:grid;place-items:center;font-size:22px;flex:none}
header .tg{margin-left:auto;background:#ffffff22;border:0;color:#fff;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px}
h2{font-size:18px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;background:var(--gr);color:#fff;font:600 14px Poppins;padding:10px 16px;border-radius:12px;cursor:pointer}
.btn.y{background:var(--ye);color:#3B2438}.btn.o{background:none;border:1.5px solid var(--line);color:var(--ink)}.btn.s{padding:6px 11px;font-size:12px;border-radius:10px}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,nav button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
input,select{width:100%;font:15px Poppins;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 3px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--soft);border-radius:14px;padding:10px 4px;text-align:center}.stat b{display:block;font-size:19px;color:var(--gold)}.stat small{font-size:10.5px;color:var(--mut);line-height:1.2;display:block}
.it{display:flex;gap:12px;align-items:center}.em{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--soft);border-radius:14px;flex:none}
.lt{width:14px;height:14px;border-radius:50%;flex:none}.lt.r{background:var(--r)}.lt.y{background:var(--y)}.lt.g{background:var(--g)}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:8px;padding:2px 8px;background:var(--soft);color:var(--gold)}.tag.r{background:#D6453D22;color:var(--r)}.tag.f{background:#2E9E5B22;color:var(--g)}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}.pills button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 13px Poppins;padding:6px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}.pills button.on{background:var(--ye);border-color:var(--ye);color:#3B2438}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}.empty b{font-size:34px;display:block}
.banner{background:var(--ye);color:#3B2438;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-weight:600}
.modal{position:fixed;inset:0;background:#000a;z-index:40;display:grid;place-items:center;padding:16px}.modal>div{background:var(--card);border-radius:22px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.scan{height:150px;background:#111;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:40px}.scan::after{content:"";position:absolute;left:0;right:0;height:3px;background:#3dff8b;animation:sc 1.4s infinite alternate}@keyframes sc{from{top:8%}to{top:92%}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;font-weight:600;z-index:50;font-size:14px;max-width:90%}
details{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;padding:2px 14px}summary{font-weight:600;padding:12px 0;cursor:pointer}details[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}details>div{padding-bottom:12px}
.big{font:700 26px Poppins;color:var(--gold)}.donut{width:130px;height:130px;border-radius:50%;flex:none;display:grid;place-items:center}.donut div{width:80px;height:80px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:700;font-size:15px;line-height:1.1}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.av{width:44px;height:44px;border-radius:50%;background:var(--ye);color:#3B2438;display:grid;place-items:center;font-weight:700;flex:none}
input[type=range]{padding:0;accent-color:var(--gr)}input[type=checkbox]{width:20px;height:20px;accent-color:var(--gr)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--or);color:#3B2438;border:0;font-size:28px;font-weight:700;box-shadow:0 4px 14px #0004;cursor:pointer;z-index:15}
@media(min-width:860px){
nav{position:sticky;top:0;height:100vh;width:230px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:16px 12px;gap:4px;flex:none}
nav .brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:14px}
nav button{flex:none;flex-direction:row;font-size:14px;gap:10px;padding:12px;justify-content:flex-start}nav .dot{position:static;margin-left:auto}
main{padding-bottom:40px}header{margin:14px 0;border-radius:22px}.fab{bottom:24px}.toast{bottom:30px}}
@media(prefers-reduced-motion:reduce){.scan::after{animation:none;top:50%}}
</style></head><body>
<div class="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=n=>{const d=new Date();d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const days=e=>Math.round((new Date(e+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const st=e=>{const d=days(e);return d<=2?'r':d<=5?'y':'g'};
const lbl=e=>{const d=days(e);return d<0?`Vencido hace ${-d} d`:d==0?'Vence hoy':d==1?'Vence mañana':`Vence en ${d} días`};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const EM={leche:'🥛',tomate:'🍅',pan:'🍞',yogur:'🥣',huevo:'🥚',arroz:'🍚',cebolla:'🧅',papa:'🥔',zanahoria:'🥕',lechuga:'🥬',platano:'🍌',queso:'🧀',pollo:'🍗',manzana:'🍎',verdura:'🥦',ajo:'🧄',fruta:'🍊'};
const em=n=>{n=norm(n);for(const k in EM)if(n.includes(k))return EM[k];return'🍽️'};
const CODES={'7750001':['Leche Gloria 1 L','Lácteos',6],'7750002':['Yogur natural','Lácteos',8],'7750003':['Pan molde','Panadería',4],'7750004':['Huevos (6)','Huevos',14]};
const STORES=[['Bodega Doña Rosa','Cayma · Av. Ramón Castilla 120'],['Panadería San José','Yanahuara · Calle Jerusalén 340'],['Mercado San Camilo, puesto 12','Cercado · Av. Perú s/n'],['Minimarket El Vecino','J. L. Bustamante · Calle Lima 215']];
const RECIPES=[['Salsa de tomate','🍝',['tomate','cebolla','ajo'],'Sofríe cebolla y ajo, agrega los tomates picados y cocina 15 min.'],['Arroz chaufa','🍳',['arroz','huevo','cebolla','zanahoria'],'Saltea verduras, suma el arroz y el huevo revuelto a fuego alto.'],['Tortilla de verduras','🥘',['huevo','papa','cebolla'],'Dora las verduras, mezcla con huevo batido y cuaja por ambos lados.'],['Tostadas con tomate','🥪',['pan','tomate'],'Tuesta el pan y cúbrelo con tomate rallado y sal.'],['Sopa de verduras','🍲',['papa','zanahoria','cebolla'],'Hierve todo picado 25 min con sal y hierbas.'],['Licuado de yogur y plátano','🥤',['yogur','platano','leche'],'Licúa todo con hielo y sirve al instante.'],['Ensalada fresca','🥗',['lechuga','tomate','zanahoria'],'Corta, mezcla y aliña con limón y aceite.']];
const seed=()=>({items:[['Leche',2,'Lácteos',1],['Tomates',1,'Verduras',4],['Yogur natural',4,'Lácteos',2],['Pan francés',0,'Panadería',6],['Huevos',9,'Huevos',6],['Cebolla',12,'Verduras',3],['Zanahoria',6,'Verduras',4],['Arroz',120,'Granos',1],['Papa',20,'Verduras',5]].map((a,i)=>({id:'i'+i,name:a[0],exp:iso(a[1]),cat:a[2],qty:a[3]})),
offers:[{id:'o1',name:'Pan francés (6)',price:0,store:1,by:'Marta R.',dist:'300 m',mine:0},{id:'o2',name:'Yogur fresas x3',price:1,store:0,by:'Luis C.',dist:'650 m',mine:0},{id:'o3',name:'Tomates y cebolla',price:2,store:2,by:'Ana P.',dist:'1,2 km',mine:0},{id:'o4',name:'Verduras variadas',price:0,store:3,by:'Pedro Q.',dist:'1,8 km',mine:0}],
res:[],stats:{cooked:0,shared:0,rescued:0,eaten:0},plan:0,alertDays:5,tab:'pan',sub:'ofrecer',filt:'todo',cat:'todas'});
let S;try{S=JSON.parse(localStorage.getItem('fa1'))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem('fa1',JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)};
const TABS=[['pan','🧺','Despensa'],['ale','🔔','Alertas'],['rec','👩‍🍳','Recetas'],['com','🤝','Compartir'],['pro','🌱','Proyecto']];
const urgent=()=>S.items.filter(i=>days(i.exp)<=2).length;
const sorted=()=>[...S.items].sort((a,b)=>a.exp<b.exp?-1:1);
const money=()=>(S.stats.cooked*6+S.stats.shared*3+S.stats.eaten*2.5).toFixed(0);
const kg=()=>((S.stats.cooked*0.8+S.stats.shared*0.5+S.stats.eaten*0.3)).toFixed(1);
const dot=c=>`<span class="lt ${c}"></span>`;
function item(i,acts=true){const c=st(i.exp);return `<div class="card it"><div class="em">${em(i.name)}</div><div class="grow"><b>${esc(i.name)}</b> <span class="mut">× ${i.qty}</span><div class="row" style="gap:6px">${dot(c)}<span class="mut">${lbl(i.exp)} · ${esc(i.cat)}</span></div></div>${acts?`<div class="row wrap" style="justify-content:flex-end;max-width:130px"><button class="btn s" data-a="eat" data-id="${i.id}" title="Lo consumí">✓</button><button class="btn s y" data-a="gooffer" data-id="${i.id}" title="Ofrecer">🤝</button><button class="btn s o" data-a="del" data-id="${i.id}" title="Eliminar">🗑</button></div>`:''}</div>`}
const V={
pan(){const cats=['todas',...new Set(S.items.map(i=>i.cat))];if(!cats.includes(S.cat))S.cat='todas';const l=sorted().filter(i=>S.cat=='todas'||i.cat==S.cat),n=c=>S.items.filter(i=>st(i.exp)==c).length;
return `<div class="stats"><div class="stat"><b style="color:var(--r)">${n('r')}</b><small>Consumir ya</small></div><div class="stat"><b style="color:var(--y)">${n('y')}</b><small>Pronto</small></div><div class="stat"><b style="color:var(--g)">${n('g')}</b><small>Bien</small></div><div class="stat"><b>S/ ${money()}</b><small>Ahorrado</small></div></div>
<div class="pills">${cats.map(c=>`<button class="${S.cat==c?'on':''}" data-a="cat" data-v="${c}">${c}</button>`).join('')}</div>${l.length?l.map(i=>item(i)).join(''):`<div class="empty"><b>🧺</b>Tu despensa está vacía.<br>Toca + para registrar tu primer alimento.</div>`}<button class="fab" data-a="add" aria-label="Agregar alimento">+</button>`},
ale(){const l=sorted().filter(i=>days(i.exp)<=S.alertDays),r=l.filter(i=>days(i.exp)<=2).length;
return `${r?`<div class="banner">⚠️ ${r} alimento${r>1?'s':''} por consumir hoy o ya vencido${r>1?'s':''}. ¡Cocina algo con ellos!</div>`:''}
<div class="card"><h3>Configurar avisos</h3><label>Avisarme cuando falten…</label><select id="ad">${[2,3,5,7].map(d=>`<option value="${d}" ${S.alertDays==d?'selected':''}>${d} días o menos</option>`).join('')}</select><div class="row" style="margin-top:10px"><button class="btn y s" data-a="notif">🔔 Activar notificaciones del celular</button></div></div>
<h2>Consume primero</h2>${l.length?l.map(i=>item(i)).join(''):`<div class="empty"><b>🎉</b>Nada urgente. Todo en buen estado.</div>`}${l.length?`<button class="btn" data-a="goRec" style="width:100%">Ver recetas con esto</button>`:''}`},
rec(){const have=S.items.map(i=>({n:norm(i.name),d:days(i.exp)}));const r=RECIPES.map(x=>{const m=x[2].filter(k=>have.some(h=>h.n.includes(k)));const u=x[2].filter(k=>have.some(h=>h.n.includes(k)&&h.d<=S.alertDays)).length;return{x,m,u}}).sort((a,b)=>b.m.length/b.x[2].length-a.m.length/a.x[2].length||b.u-a.u);
return `<h2 style="margin-top:4px">Recetas para hoy</h2><p class="mut">Ordenadas según lo que ya tienes y lo que vence primero.</p>`+r.map(({x,m,u})=>{const f=x[2].filter(k=>!m.includes(k));return `<div class="card"><div class="row"><div class="em">${x[1]}</div><div class="grow"><b>${x[0]}</b><div class="mut">Tienes ${m.length}/${x[2].length} ingredientes${u?` · usa ${u} por vencer`:''}</div></div></div><p class="mut" style="margin:8px 0">${x[3]}</p><div class="row sp wrap"><span class="mut">${f.length?'Te falta: '+f.join(', '):'<span class="tag f">¡Tienes todo!</span>'}</span><button class="btn s" data-a="cook" data-v="${RECIPES.indexOf(x)}" ${m.length<2?'disabled style="opacity:.4"':''}>Cocinar</button></div></div>`}).join('')},
com(){const sub=S.sub,sb=`<div class="pills">${[['ofrecer','Ofrecer'],['cerca','Cerca de ti'],['reserva','Mi reserva'+(S.res.length?` (${S.res.length})`:'')]].map(a=>`<button class="${sub==a[0]?'on':''}" data-a="sub" data-v="${a[0]}">${a[1]}</button>`).join('')}</div>`;
if(sub=='ofrecer'){const mine=S.offers.filter(o=>o.mine);return sb+`<div class="card"><h3>¿Qué no vas a usar?</h3><p class="mut">Elige alimentos y compártelos con tus vecinos.</p>${S.items.length?sorted().map(i=>`<label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:14px;margin:6px 0"><input type="checkbox" class="ck" value="${i.id}" ${S.pre==i.id?'checked':''}>${em(i.name)} ${esc(i.name)} <span class="mut">· ${lbl(i.exp)}</span></label>`).join(''):'<p class="mut">No tienes alimentos registrados.</p>'}
<div class="grid2"><div><label>Precio (S/)</label><label style="display:flex;gap:8px;align-items:center;margin:4px 0 6px;color:var(--ink);font-size:14px"><input type="checkbox" id="gr" checked>Gratis</label><input type="number" id="pr" min="0.1" step="0.1" placeholder="Ej. 3.50" disabled></div><div><label>Punto de recojo (tienda aliada)</label><select id="stn">${STORES.map((s,i)=>`<option value="${i}">${s[0]}</option>`).join('')}</select></div></div><button class="btn" data-a="offer" style="width:100%;margin-top:12px">Publicar oferta</button></div>
${mine.length?'<h2>Mis ofertas</h2>':''}${mine.map(o=>offer(o)).join('')}`}
if(sub=='cerca'){const l=S.offers.filter(o=>!o.mine&&(S.filt=='todo'||(S.filt=='gratis'?o.price==0:o.price>0)));return sb+`<div class="pills">${['todo','gratis','bajo costo'].map(f=>`<button class="${S.filt==f?'on':''}" data-a="filt" data-v="${f}">${f}</button>`).join('')}</div>${l.length?l.map(o=>offer(o)).join(''):'<div class="empty"><b>📍</b>No hay ofertas con ese filtro.</div>'}`}
return sb+(S.res.length?S.res.map(r=>{const o=S.offers.find(x=>x.id==r.oid)||r.o,s=STORES[o.store];return `<div class="card"><div class="row"><div class="em">✅</div><div class="grow"><b>¡Reserva confirmada!</b><div class="mut">${esc(o.name)} · ${o.price?'S/ '+o.price:'Gratis'}</div></div></div><p style="margin:10px 0 4px">📍 <b>${s[0]}</b><br><span class="mut">${s[1]}</span></p><p class="mut" style="margin:0">Muestra este código al recoger:</p><div class="big">${r.code}</div><div class="row" style="margin-top:8px"><button class="btn s" data-a="pick" data-id="${r.id}">Ya lo recogí</button><button class="btn s o" data-a="cancelres" data-id="${r.id}">Cancelar</button></div></div>`}).join(''):'<div class="empty"><b>🛍️</b>Aún no tienes reservas.<br>Busca en “Cerca de ti”.</div>')},
pro(){const C=[['Hosting y dominio',30,'#1F4D3A'],['Internet y soporte',40,'#E8A81C'],['Licencias',20,'#3B2438'],['Recojos',40,'#E07B39'],['Difusión en redes',50,'#8DBF9E']],p=S.price||5,n=Math.ceil(180/(p*.965));let a=0;const cg=C.map(c=>{const s=a;a+=c[1]/180*100;return `${c[2]} ${s}% ${a}%`}).join(',');
const P=(t,b)=>`<details><summary>${t}</summary><div>${b}</div></details>`,T=[['Choque Salgado, Jesus Sebastian','Coordinación general'],['Cornejo Valdez, Reyd Adier','Investigación y usuarios'],['Delgado Murguia, Hector Mauricio','Desarrollo del prototipo'],['Estrada Yahuira, Leonel','Marketing y difusión'],['Flores Ccama, Alexander','Finanzas y ventas'],['Huere Hancco, Ana Lucia','Logística y alianzas']];
return `<div class="card" style="background:var(--gr);color:#fff"><h3>Tu impacto</h3><div class="stats" style="margin:8px 0 0"><div class="stat" style="background:#ffffff22"><b style="color:var(--ye)">${S.stats.cooked}</b><small style="color:#fff">Recetas cocinadas</small></div><div class="stat" style="background:#ffffff22"><b style="color:var(--ye)">${S.stats.shared+S.stats.rescued}</b><small style="color:#fff">Comidas compartidas</small></div><div class="stat" style="background:#ffffff22"><b style="color:var(--ye)">${kg()} kg</b><small style="color:#fff">Salvados</small></div><div class="stat" style="background:#ffffff22"><b style="color:var(--ye)">S/ ${money()}</b><small style="color:#fff">Ahorrados (est.)</small></div></div></div>
<h2>Sobre el proyecto</h2><p class="mut">EcoMesa · Innovación Social · NRC 28578 · Docente: Arapa Cambi, Deivy Elias. <b>Reduce · Comparte · Cuida.</b></p>
${P('🗑️ Nuestro problema','<div class="big">67,34 kg</div><p class="mut" style="margin:0 0 8px">de comida que cada peruano desecha al año</p><div class="big">12,8 M t</div><p class="mut" style="margin:0 0 8px">de alimentos perdidos al año en el Perú (47,6 % de lo disponible)</p><p class="mut">En Arequipa vimos falta de planificación, imprevistos y poco control de fechas. Fuente: Bedoya-Perales y Dal’ Magro (2021); Agraria.pe (2021).</p>')}
${P('💡 Nuestra solución','<p><b>Organiza:</b> registra tus alimentos y su vencimiento.<br><b>Aprovecha:</b> recibe alertas y recetas con lo que tienes.<br><b>Comparte:</b> ofrece a tus vecinos lo que no usarás.</p><p class="mut">Diferencial: todo en uno, ahorro medible y red vecinal con entregas seguras en tiendas aliadas.</p>')}
${P('🆚 Competencia','<p><b>Too Good To Go</b> (Dinamarca): +57 M usuarios; vende bolsas sorpresa de comercios.<br><b>Cirkula</b> (Perú): +500 mil usuarios; vende excedentes de restaurantes.</p><p><b>FrescoAlerta:</b> evita perder comida <i>en casa</i> y la comparte entre vecinos.</p>')}
${P('🎯 Mercado y usuario','<p><b>B2C:</b> familias de Arequipa, primero familias jóvenes de condominios y urbanizaciones centrales.<br><b>B2B:</b> bodegas, panaderías y mercados como puntos de recojo.</p><p class="mut">Usuario: adulto que compra y cocina, con poco tiempo, olvida vencimientos y usa WhatsApp a diario. 95,4 % de hogares peruanos tiene smartphone (Osiptel, 2025).</p>')}
${P('💰 Costos y ganancias (calculadora)',`<div class="row"><div class="donut" style="background:conic-gradient(${cg})"><div>S/ 180<br>al mes</div></div><div class="grow mut">${C.map(c=>`<div><span class="sw" style="background:${c[2]}"></span>${c[0]}: S/ ${c[1]}`+'</div>').join('')}</div></div><label>Precio del plan familiar: S/ ${p} al mes</label><input type="range" id="pp" min="2" max="15" value="${p}"><p>Con ese precio hacen falta <b>≈ ${n} familias</b> para cubrir los costos (comisión de pasarela 3,5 %).</p><p class="mut">Gratis: funciones básicas. MVP sin código: S/ 300 pago único. Precio por validar.</p><button class="btn ${S.plan?'o':'y'}" data-a="plan">${S.plan?'✓ Plan familiar activo (simulado) · Cambiar a gratis':'Probar plan familiar S/ 5 (simulado)'}</button>`)}
${P('📈 Oportunidad de mercado','<p>12,8 M t perdidas al año en Perú · US$ 150 mil M en América Latina y el Caribe (FAO) · 95,4 % de hogares con smartphone.</p>')}
${P('🗺️ Mapa de ruta, misión y visión','<p><b>1 año:</b> validar con familias de Arequipa.<br><b>3 años:</b> tiendas aliadas en todos los distritos.<br><b>5 años:</b> otras ciudades del sur.<br><b>10 años:</b> referente nacional contra el desperdicio.</p><p><b>Misión:</b> ayudar a las familias a aprovechar cada alimento, ahorrar y compartir lo que sobra.<br><b>Visión:</b> un Perú donde ningún alimento en buen estado termina en la basura.</p>')}
${P('🌍 ODS','<p><b>ODS 3 · Salud y bienestar:</b> menos comida botada y mejor nutrición.<br><b>ODS 12 · Producción y consumo responsables:</b> comprar lo necesario y aprovechar las sobras.</p>')}
${P('👥 Equipo EcoMesa',T.map(t=>`<div class="row" style="margin:8px 0"><div class="av">${t[0].split(', ')[1][0]+t[0][0]}</div><div><b>${t[0]}</b><div class="mut">${t[1]}</div></div></div>`).join(''))}
<p class="empty">“Cada alimento que aprovechamos es una oportunidad para cuidar a las personas y al planeta.”<br><button class="btn o s" data-a="reset" style="margin-top:10px">Restablecer datos de ejemplo</button></p>`}};
function offer(o){const s=STORES[o.store],rs=S.res.some(r=>r.oid==o.id);return `<div class="card it"><div class="em">${em(o.name)}</div><div class="grow"><b>${esc(o.name)}</b> ${o.price?`<span class="tag">S/ ${Number(o.price).toFixed(2)}</span>`:'<span class="tag f">Gratis</span>'}<div class="mut">${o.mine?'Tuya':esc(o.by)+' · '+o.dist}<br>📍 ${s[0]}</div></div>${o.mine?`<div class="row wrap" style="max-width:110px"><button class="btn s" data-a="deliv" data-id="${o.id}">Entregado</button><button class="btn s o" data-a="deloff" data-id="${o.id}">Quitar</button></div>`:`<button class="btn s ${rs?'o':''}" data-a="reserve" data-id="${o.id}" ${rs?'disabled':''}>${rs?'Reservado':'Reservar'}</button>`}</div>`}
function render(){$('#nav').innerHTML=`<div class="brand"><div class="logo" style="background:var(--ye)">🥬</div>FrescoAlerta</div>`+TABS.map(t=>`<button class="${S.tab==t[0]?'on':''}" data-a="tab" data-v="${t[0]}" aria-label="${t[2]}"><span>${t[1]}</span>${t[2]}${t[0]=='ale'&&urgent()?`<i class="dot">${urgent()}</i>`:''}</button>`).join('');
const T=TABS.find(t=>t[0]==S.tab);$('#main').innerHTML=`<header><div class="logo">🥬</div><div><h1>${T[2]}</h1><p>FrescoAlerta · Reduce · Comparte · Cuida</p></div><button class="tg" data-a="theme" aria-label="Cambiar tema">🌓</button></header>`+V[S.tab]();save()}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div>${h}</div>`;m.onclick=e=>{if(e.target==m)m.remove()};document.body.append(m);return m}
function addForm(pre={}){const m=modal(`<h3>Agregar alimento</h3><button class="btn y" id="sc" style="width:100%;margin-top:8px">📷 Escanear código de barras</button><label>Nombre</label><input id="fn" value="${esc(pre.n||'')}" placeholder="Ej. Tomates"><div class="grid2"><div><label>Vence el</label><input type="date" id="fd" value="${pre.d||iso(5)}"></div><div><label>Cantidad</label><input type="number" id="fq" min="1" value="1"></div></div><label>Categoría</label><select id="fc">${['Verduras','Frutas','Lácteos','Panadería','Huevos','Carnes','Granos','Otros'].map(c=>`<option ${pre.c==c?'selected':''}>${c}</option>`).join('')}</select><div class="row" style="margin-top:14px"><button class="btn grow" id="fs">Guardar</button><button class="btn o" id="fx">Cancelar</button></div>`);
m.querySelector('#fx').onclick=()=>m.remove();
m.querySelector('#sc').onclick=()=>{m.remove();const k=Object.keys(CODES),s=modal(`<h3>Escaneando…</h3><div class="scan">▮▯▮▮▯▮</div><p class="mut">Apunta al código de barras. (Simulación en el prototipo)</p><button class="btn o" id="cx" style="width:100%">Cancelar</button>`);s.querySelector('#cx').onclick=()=>s.remove();setTimeout(()=>{if(!s.isConnected)return;s.remove();const c=CODES[k[Math.floor(Math.random()*k.length)]];addForm({n:c[0],c:c[1],d:iso(c[2])});toast('Código leído ✓')},2000)};
m.querySelector('#fs').onclick=()=>{const n=m.querySelector('#fn').value.trim();if(!n)return toast('Escribe el nombre del alimento');S.items.push({id:'i'+Date.now(),name:n,exp:m.querySelector('#fd').value,qty:+m.querySelector('#fq').value||1,cat:m.querySelector('#fc').value});m.remove();render();toast('Alimento agregado ✓')}}
document.addEventListener('change',e=>{if(e.target.id=='gr'){const p=$('#pr');p.disabled=e.target.checked;if(!e.target.checked)p.focus()}if(e.target.id=='ad'){S.alertDays=+e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id=='pp'){S.price=+e.target.value;const y=scrollY;render();scrollTo(0,y);$('#pp')?.focus()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v,it=S.items.find(i=>i.id==id);
if(a=='tab'){S.tab=v;S.pre=null}else if(a=='cat')S.cat=v;else if(a=='sub')S.sub=v;else if(a=='filt')S.filt=v;
else if(a=='add')return addForm();
else if(a=='eat'){S.items=S.items.filter(i=>i.id!=id);S.stats.eaten++;toast('¡Bien! Aprovechaste '+it.name)}
else if(a=='del'){S.items=S.items.filter(i=>i.id!=id);toast('Alimento eliminado')}
else if(a=='gooffer'){S.tab='com';S.sub='ofrecer';S.pre=id}
else if(a=='goRec')S.tab='rec';
else if(a=='notif'){try{Notification.requestPermission().then(p=>{if(p=='granted'){new Notification('FrescoAlerta',{body:`Tienes ${urgent()} alimento(s) por consumir pronto`});toast('Notificaciones activadas ✓')}else toast('Permiso denegado: verás los avisos dentro de la app')})}catch(x){toast('Tu navegador no admite notificaciones; verás los avisos aquí')}return}
else if(a=='cook'){const r=RECIPES[v],used=[];r[2].forEach(k=>{const f=sorted().find(i=>norm(i.name).includes(k));if(f){used.push(f.name);f.qty--;if(f.qty<=0)S.items=S.items.filter(i=>i!=f)}});S.stats.cooked++;toast('¡Buen provecho! Usaste: '+used.join(', '))}
else if(a=='offer'){const ids=[...document.querySelectorAll('.ck:checked')].map(c=>c.value);if(!ids.length)return toast('Elige al menos un alimento');const free=$('#gr').checked,pv=Math.round(parseFloat($('#pr').value)*100)/100;if(!free&&!(pv>0))return toast('Escribe un precio mayor a 0 o marca Gratis');const ns=ids.map(i=>S.items.find(x=>x.id==i).name);S.offers.unshift({id:'o'+Date.now(),name:ns.join(', '),price:free?0:pv,store:+$('#stn').value,by:'Tú',dist:'',mine:1});S.items=S.items.filter(i=>!ids.includes(i.id));S.pre=null;toast('Oferta publicada ✓ Tus vecinos ya la ven')}
else if(a=='deloff'){S.offers=S.offers.filter(o=>o.id!=id);toast('Oferta quitada')}
else if(a=='deliv'){S.offers=S.offers.filter(o=>o.id!=id);S.stats.shared++;toast('¡Gracias por compartir! 💚')}
else if(a=='reserve'){const o=S.offers.find(x=>x.id==id);S.res.push({id:'r'+Date.now(),oid:id,o,code:'FA-'+Math.floor(1000+Math.random()*9000)});S.sub='reserva';toast('Reserva confirmada ✓')}
else if(a=='pick'){const r=S.res.find(x=>x.id==id);S.res=S.res.filter(x=>x.id!=id);S.offers=S.offers.filter(o=>o.id!=r.oid);S.stats.rescued++;toast('¡Entrega completada! 🎉')}
else if(a=='cancelres'){S.res=S.res.filter(x=>x.id!=id);toast('Reserva cancelada')}
else if(a=='plan'){S.plan=S.plan?0:1}
else if(a=='theme'){const d=document.documentElement,dk=matchMedia('(prefers-color-scheme:dark)').matches,cur=d.dataset.theme||(dk?'dark':'light');d.dataset.theme=cur=='dark'?'light':'dark';return}
else if(a=='reset'){if(confirm('¿Restablecer todos los datos?')){S=seed();S.tab='pro'}else return}
render();if(['tab','sub','gooffer','goRec'].includes(a))scrollTo(0,0)});
render();
</script></body></html>
